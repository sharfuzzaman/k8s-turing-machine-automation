replicaCount: 2

image:
  repository: devops8080/react-turing-machine-nginx
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 80

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

serviceAccount:
  create: true
  annotations: {}
  automount: true
  name: ""
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []